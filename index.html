<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Min Gym App</title>
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-icon">💪</div>
      <h1>Min Gym App</h1>
      <p class="version">v1.3</p>
    </header>

    <nav class="tabs" aria-label="Huvudmeny">
      <button class="tab active" data-tab="today">🏋️ Pass</button>
      <button class="tab" data-tab="plans">📋 Upplägg</button>
      <button class="tab" data-tab="history">📅 Historik</button>
      <button class="tab" data-tab="pb">🏆 PB</button>
    </nav>

    <main>
      <section id="today" class="view active">
        <div class="card hero-card">
          <h2>Dagens pass</h2>
          <p class="muted">Välj ett upplägg och starta dagens träning.</p>
          <label for="workoutSelect">Välj upplägg</label>
          <select id="workoutSelect"></select>
          <button id="startSessionBtn" class="primary">Starta pass</button>
        </div>
        <div id="activeSession" class="session-area"></div>
      </section>

      <section id="plans" class="view">
        <div class="card">
          <h2>Upplägg</h2>
          <p class="muted">Skapa och redigera dina standardvikter.</p>
          <label for="planName">Namn på upplägg</label>
          <input id="planName" type="text" placeholder="Exempel: Upplägg 1" />
          <button id="newPlanBtn" class="secondary">Skapa nytt upplägg</button>
        </div>
        <div id="planEditor"></div>
        <div id="plansList"></div>
      </section>

      <section id="history" class="view">
        <div class="card">
          <h2>Historik</h2>
          <p class="muted">Här visas sparade träningspass.</p>
        </div>
        <div id="historyList"></div>
      </section>

      <section id="pb" class="view">
        <div class="card trophy-card">
          <h2>🏆 Personbästa</h2>
          <p class="muted">Tyngsta vikt per övning baserat på historiken.</p>
        </div>
        <div id="pbList"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
